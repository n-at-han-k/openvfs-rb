plugins:
  - rubocop-nathan-k

AllCops:
  DisabledByDefault: true

# General Layout rules:

Layout/IndentationStyle:
  Enabled: true
  EnforcedStyle: spaces

Layout/InitialIndentation:
  Enabled: true

Layout/IndentationWidth:
  Enabled: true
  Width: 2

Layout/IndentationConsistency:
  Enabled: true
  EnforcedStyle: normal

Layout/BlockAlignment:
  Enabled: true

Layout/EndAlignment:
  Enabled: true
  EnforcedStyleAlignWith: start_of_line

Layout/BeginEndAlignment:
  Enabled: true
  EnforcedStyleAlignWith: start_of_line

Layout/RescueEnsureAlignment:
  Enabled: true

Layout/ElseAlignment:
  Enabled: true

Layout/DefEndAlignment:
  Enabled: true

Layout/CaseIndentation:
  Enabled: true
  EnforcedStyle: end

Layout/CommentIndentation:
  Enabled: true

Layout/FirstHashElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/EmptyLinesAroundClassBody:
  Enabled: true

Layout/EmptyLinesAroundModuleBody:
  Enabled: true

Layout/EmptyLineAfterMagicComment:
   Enabled: true

Layout/SpaceInsideBlockBraces:
  Enabled: true
  EnforcedStyle: no_space
  SpaceBeforeBlockParameters: false

Layout/SpaceAroundBlockParameters:
  Enabled: true
  EnforcedStyleInsidePipes: no_space

Layout/FirstArrayElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/ArrayAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/FirstArgumentIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/ArgumentAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/ClosingParenthesisIndentation:
  Enabled: true

Layout/TrailingWhitespace:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

# House style, from rubocop-nathan-k. The plugin enables all of these by default; they are
# listed here so the set in use is visible, and because `DisabledByDefault` would otherwise
# switch them off.

# Bans assigning a `begin...end` expression; the assignment goes inside the block.
NathanK/BeginBlockAssignment:
  Enabled: true

# Bans assigning an `if` / `case` expression; assign inside each branch instead.
NathanK/NoConditionalAssignment:
  Enabled: true

# Bans modifier `if` / `unless`, so a guard cannot hide off the right edge of a long line.
NathanK/NoModifierIf:
  Enabled: true

# Bans `return`. The method's last expression is its return value, and guards are structural.
NathanK/NoReturn:
  Enabled: true

# Requires `tap` where a method assigns a local on its first line and returns it on its last.
NathanK/UseTap:
  Enabled: true

# How a comment is built: measured against how async-rest, async-discord and async-ollama document
# themselves, and parsed by decode so that an annotation is whatever decode recognises as one.
#
# A paragraph is one line however long - none of the 99 summary paragraphs in those projects is
# wrapped, and async-rest's reach 544 characters. A summary is short, and no longer than the code it
# describes earns: ten words, plus three per line of body, to a ceiling of thirty, which fits all 76
# of their documented methods bar one. A module gets ten words, which is exactly what the one
# commented module in async-rest uses. And a method described in prose documents its signature with
# annotations rather than leaving it to the reader.
#
# Nothing is corrected automatically: a comment which breaks these has to be rewritten.
NathanK/CommentStructure:
  Enabled: true

  # The word allowances: ten words, plus three per line of method body, to a ceiling of thirty. A
  # module gets ten whatever its size.
  MaximumWords: 30
  BaseWords: 10
  WordsPerLine: 3
  ModuleWords: 10

  # Each check is scoped on its own. No `Include` means everywhere; an `Include` narrows it, and
  # `Exclude` then removes paths from what is left.
  Wrapping:
    Enabled: true

  Length:
    Enabled: true

  # Annotations document an interface, so they are asked for where there is one. A case in `test`
  # is called by nobody.
  Annotations:
    Enabled: true
    Include:
      - "lib/**/*.rb"
      - "fixtures/**/*.rb"
