name: Test macOS

# Same as test-linux but on an apple-silicon macos runner. The nix dev
# shell carries the darwin-compatible Qt stack; the gem is otherwise the
# same code.

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build native extensions
        run: |
          nix develop --command ruby -C ext/openvfs extconf.rb
          nix develop --command make -C ext/openvfs
          nix develop --command ruby -C ext/openvfs/occ extconf.rb
          nix develop --command make -C ext/openvfs/occ

      - name: The suite is green
        run: nix develop --command bundle exec sus

      - name: The tree is clean
        if: ${{ !cancelled() }}
        run: nix develop --command bundle exec rubocop
