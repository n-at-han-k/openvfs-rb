name: Test Linux

# Build the openvfs and occ extensions inside the nix dev shell, run the
# full sus suite and rubocop. One platform per test workflow so a Windows
# or darwin problem does not have to wait on the other two.

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build native extensions
        run: |
          nix develop --command ruby -C ext/openvfs extconf.rb
          nix develop --command make -C ext/openvfs
          nix develop --command ruby -C ext/openvfs/occ extconf.rb
          nix develop --command make -C ext/openvfs/occ

      - name: The suite is green
        run: nix develop --command bundle exec sus

      - name: The tree is clean
        if: ${{ !cancelled() }}
        run: nix develop --command bundle exec rubocop
