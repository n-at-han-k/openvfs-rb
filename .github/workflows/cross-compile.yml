name: Cross Compile

# Cross-compiles the C++/Qt native extensions and uploads them as build
# artifacts. Mirrors the structure of vodozemac-rb's cross-compile workflow,
# adapted for a C++ native gem whose dependencies (Qt 6, the OpenVFS
# library, the trimmed OpenCloud Desktop static library) are built via nix.
#
# Linux and macOS build inside nix (the flake provides all native deps).
#
# Windows cannot use nix, so it builds the same static library with CMake against
# MSYS2's ucrt64 toolchain - the one RubyInstaller's own ucrt builds use - and
# compiles only the occ extension. The openvfs extension is left out there: it wraps
# libopenvfs, which keeps its placeholder state in POSIX extended attributes, and
# upstream gates its desktop plugin behind `if (NOT WIN32)` for that reason. The gem
# configures `virtualFilesMode=off`, so nothing in the API surface needs it.
#
# This does NOT publish to RubyGems — releasing is a manual step you perform
# with the built gems (see README).

on:
  push:
    branches: [main]
    paths:
      - 'ext/**'
      - 'openvfs-rb.gemspec'
      - 'Rakefile'
      - 'flake.nix'
      - 'flake.lock'
      - 'gemset.nix'
      - '.github/workflows/cross-compile.yml'
      - 'lib/**'
      # The patches decide which desktop sources are compiled at all, and the
      # submodule pointer decides what they apply to.
      - 'patches/**'
      - 'opencloud-desktop'
  workflow_dispatch:

permissions:
  contents: read
  # Magic Nix Cache authenticates with this.
  id-token: write

# Keyed by workflow as well as ref: a new push cancels this workflow's own previous
# run rather than queueing another behind it. Sharing one group across workflows
# instead makes the two runs of a single push cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-data:
    name: Fetch the supported platforms and Ruby versions
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: oxidize-rb/actions/fetch-ci-data@v1
        id: fetch
        with:
          supported-ruby-platforms: true
          stable-ruby-versions: |
            exclude: [head]

  cross-gem:
    name: Compile native gem for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: ci-data
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            os: ubuntu-latest
            ruby: "3.4"
          - platform: aarch64-linux
            os: ubuntu-24.04-arm
            ruby: "3.4"
          - platform: x86_64-darwin
            os: macos-15-intel
            ruby: "3.4"
          - platform: aarch64-darwin
            os: macos-15
            ruby: "3.4"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Determinate installer plus Magic Nix Cache, which is the pairing their
      # docs show. The cache registers itself as a substituter and a post-build hook,
      # so every path nix builds here is pushed and every path it wants is looked up,
      # with no key to get right. Needs id-token: write, set on the workflow.
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build native extensions
        run: |
          nix develop --command ruby -C ext/openvfs extconf.rb
          nix develop --command make -C ext/openvfs
          nix develop --command ruby -C ext/openvfs/occ extconf.rb
          nix develop --command make -C ext/openvfs/occ

      - name: Run the suite
        run: nix develop --command bundle exec sus

      # Each is copied on its own so one that was never built does not stop the rest
      # being cached: on a failed run some of them exist and some do not.
      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.platform }}
          path: |
            ext/openvfs/openvfs.so
            ext/openvfs/occ/occ.so
            ext/openvfs/openvfs.bundle
            ext/openvfs/occ/occ.bundle
          if-no-files-found: error

  cross-gem-windows:
    name: Compile native gem for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64-mingw-ucrt
            os: windows-2025
            ruby: "3.4"
    steps:
      # The patches are LF, and git-for-windows would otherwise check the submodule
      # out with CRLF and make every one of them fail to apply.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ruby/setup-ruby-pkgs@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          mingw: cmake ninja pkgconf qt6-base qtkeychain sqlite3 zlib extra-cmake-modules

      - name: Apply the desktop patches
        shell: bash
        run: bin/apply-patches

      # The build tree, not the install prefix: ninja then recompiles only the files a
      # patch actually changed instead of all 80 again. The runner's workspace path is
      # stable, so the absolute paths in CMakeCache stay valid between runs.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: build/desktop-upload
          key: desktop-upload-${{ matrix.platform }}-${{ hashFiles('patches/**') }}-${{ github.sha }}
          restore-keys: |
            desktop-upload-${{ matrix.platform }}-${{ hashFiles('patches/**') }}-
            desktop-upload-${{ matrix.platform }}-

      - name: Build the trimmed desktop static library
        shell: pwsh
        run: |
          $prefix = "$env:GITHUB_WORKSPACE/build/prefix" -replace '\\', '/'
          $sha1 = git -C opencloud-desktop rev-parse HEAD
          cmake -S opencloud-desktop -B build/desktop-upload -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_INSTALL_PREFIX=$prefix" `
            "-DGIT_SHA1=$sha1"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/desktop-upload
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/desktop-upload
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "OPENCLOUD_UPLOAD_PREFIX=$prefix" >> $env:GITHUB_ENV

      - name: Build the occ extension
        shell: pwsh
        run: |
          gem install rice --no-document
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ruby -C ext/openvfs/occ extconf.rb
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          make -C ext/openvfs/occ
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # extconf reports every failure as "no", so the reason a check failed is only in
      # mkmf.log, which stays on the runner.
      - name: Show mkmf.log
        if: ${{ failure() }}
        shell: pwsh
        run: |
          foreach ($log in @("ext/openvfs/occ/mkmf.log", "ext/openvfs/mkmf.log")) {
            if (Test-Path $log) {
              Write-Host "===== $log"
              Get-Content $log
            }
          }

      # The openvfs extension is not built here, so this is also the check that
      # requiring occ no longer drags it in.
      - name: Load the extension
        shell: pwsh
        run: ruby -Ilib -Iext -e 'require "openvfs/occ"; puts OpenVFS::VERSION'

      # Saved even when a later step failed: the object files already compiled are
      # exactly what makes the next attempt quick.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: build/desktop-upload
          key: desktop-upload-${{ matrix.platform }}-${{ hashFiles('patches/**') }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.platform }}
          path: ext/openvfs/occ/occ.so
          if-no-files-found: error
