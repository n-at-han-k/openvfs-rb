name: Cross Compile

# Cross-compiles the C++/Qt native extensions and packages them into precompiled,
# per-platform native gems, uploaded as build artifacts. This does NOT publish to
# RubyGems — releasing is bin/release-gem, which downloads these and pushes them.
#
# A compiled object only loads on the Ruby ABI it was built against, so one gem per
# platform carries one object per ABI, under lib/openvfs/3.4 and so on, and
# lib/openvfs.rb picks by RUBY_VERSION. That is why this is two stages: cross-objects
# compiles every (platform, ABI) pair, and cross-gem collects a platform's ABIs into
# one gem. vodozemac-rb gets the same layout from rb-sys, whose ExtensionTask
# cross-compiles every ABI in one step; that toolchain is Rust-only, so the matrix does
# it here.
#
# Covering a range of ABIs is also what keeps these gems out of rubygems.org's
# content-addressable scheme, which refuses a push unless required_rubygems_version is
# ">= 4.1.0.a" - a prerelease floor almost nothing meets. A gem built for a single ABI
# has to say so, and then name, version and platform no longer identify it.
#
# Linux and macOS build inside nix, whose flake provides both the native dependencies
# and a shell per Ruby ABI.
#
# Windows cannot use nix, so it builds the same static library with CMake against
# MSYS2's ucrt64 toolchain - the one RubyInstaller's own ucrt builds use - and
# compiles only the occ extension. The openvfs extension is left out there: it wraps
# libopenvfs, which keeps its placeholder state in POSIX extended attributes, and
# upstream gates its desktop plugin behind `if (NOT WIN32)` for that reason. The gem
# configures `virtualFilesMode=off`, so nothing in the API surface needs it.

on:
  push:
    branches: [main]
    paths:
      - 'ext/**'
      - 'openvfs-rb.gemspec'
      - 'flake.nix'
      - 'flake.lock'
      - 'gemset.nix'
      - 'bin/package-platform-gem'
      - '.github/workflows/cross-compile.yml'
      - 'lib/**'
      # The patches decide which desktop sources are compiled at all, and the
      # submodule pointer decides what they apply to.
      - 'patches/**'
      - 'opencloud-desktop'
  workflow_dispatch:

permissions:
  contents: read
  # Magic Nix Cache authenticates with this.
  id-token: write

# Keyed by workflow as well as ref: a new push cancels this workflow's own previous
# run rather than queueing another behind it. Sharing one group across workflows
# instead makes the two runs of a single push cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-objects:
    name: Compile ${{ matrix.target.platform }} objects for Ruby ${{ matrix.ruby.abi }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every ABI has to build, or bin/package-platform-gem refuses to package: a gem
        # whose required_ruby_version covers an ABI it has no object for would install
        # and then fail to load. The set has to match RUBY_ABIS there, and the shells in
        # flake.nix.
        ruby:
          - { abi: "3.3", shell: ruby-33 }
          - { abi: "3.4", shell: ruby-34 }
          - { abi: "4.0", shell: ruby-40 }
        target:
          - { platform: x86_64-linux, os: ubuntu-latest }
          - { platform: aarch64-linux, os: ubuntu-24.04-arm }
          - { platform: x86_64-darwin, os: macos-15-intel }
          - { platform: aarch64-darwin, os: macos-15 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Determinate installer plus Magic Nix Cache, which is the pairing their
      # docs show. The cache registers itself as a substituter and a post-build hook,
      # so every path nix builds here is pushed and every path it wants is looked up,
      # with no key to get right. Needs id-token: write, set on the workflow.
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build native extensions
        run: |
          nix develop .#${{ matrix.ruby.shell }} --command ruby -C ext/openvfs extconf.rb
          nix develop .#${{ matrix.ruby.shell }} --command make -C ext/openvfs
          nix develop .#${{ matrix.ruby.shell }} --command ruby -C ext/openvfs/occ extconf.rb
          nix develop .#${{ matrix.ruby.shell }} --command make -C ext/openvfs/occ

      - name: Run the suite
        run: nix develop .#${{ matrix.ruby.shell }} --command bundle exec sus

      # Named rather than globbed: macOS leaves an openvfs.bundle.dSYM directory of debug
      # symbols beside each object, which `cp` refuses and the gem has no use for. Each is
      # tested for because only one of .so and .bundle exists on any given runner.
      - name: Stage the objects
        run: |
          mkdir -p objects
          for object in ext/openvfs/openvfs.so ext/openvfs/openvfs.bundle \
                        ext/openvfs/occ/occ.so ext/openvfs/occ/occ.bundle; do
            if [ -f "$object" ]; then
              cp "$object" objects/
            fi
          done
          ls -l objects

      - uses: actions/upload-artifact@v4
        with:
          name: objects-${{ matrix.target.platform }}-${{ matrix.ruby.abi }}
          path: objects/*
          if-no-files-found: error

  cross-objects-windows:
    name: Compile ${{ matrix.target.platform }} objects for Ruby ${{ matrix.ruby.abi }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - { abi: "3.3" }
          - { abi: "3.4" }
          - { abi: "4.0" }
        target:
          - { platform: x64-mingw-ucrt, os: windows-2025 }
    steps:
      # The patches are LF, and git-for-windows would otherwise check the submodule
      # out with CRLF and make every one of them fail to apply.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ruby/setup-ruby-pkgs@v1
        with:
          ruby-version: ${{ matrix.ruby.abi }}
          mingw: cmake ninja pkgconf qt6-base qtkeychain sqlite3 zlib extra-cmake-modules

      - name: Apply the desktop patches
        shell: bash
        run: bin/apply-patches

      # The build tree, not the install prefix: ninja then recompiles only the files a
      # patch actually changed instead of all 80 again. CMakeCache.txt holds absolute
      # paths to the toolchain, and MSYS2 lives under the Ruby it came with -
      # .../Ruby/3.4.12/x64/msys64/ucrt64 - so the ABI is part of the key. Sharing one
      # entry across the matrix hands a job a cache naming a Ruby it does not have, and
      # cmake fails on the first tool it tries to run.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: build/desktop-upload
          key: desktop-upload-${{ matrix.target.platform }}-ruby${{ matrix.ruby.abi }}-${{ hashFiles('patches/**') }}-${{ github.sha }}
          restore-keys: |
            desktop-upload-${{ matrix.target.platform }}-ruby${{ matrix.ruby.abi }}-${{ hashFiles('patches/**') }}-
            desktop-upload-${{ matrix.target.platform }}-ruby${{ matrix.ruby.abi }}-

      - name: Build the trimmed desktop static library
        shell: pwsh
        run: |
          $prefix = "$env:GITHUB_WORKSPACE/build/prefix" -replace '\\', '/'
          $sha1 = git -C opencloud-desktop rev-parse HEAD
          cmake -S opencloud-desktop -B build/desktop-upload -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_INSTALL_PREFIX=$prefix" `
            "-DGIT_SHA1=$sha1"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/desktop-upload
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/desktop-upload
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "OPENCLOUD_UPLOAD_PREFIX=$prefix" >> $env:GITHUB_ENV

      - name: Build the occ extension
        shell: pwsh
        run: |
          gem install rice --no-document
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ruby -C ext/openvfs/occ extconf.rb
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          make -C ext/openvfs/occ
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # extconf reports every failure as "no", so the reason a check failed is only in
      # mkmf.log, which stays on the runner.
      - name: Show mkmf.log
        if: ${{ failure() }}
        shell: pwsh
        run: |
          foreach ($log in @("ext/openvfs/occ/mkmf.log", "ext/openvfs/mkmf.log")) {
            if (Test-Path $log) {
              Write-Host "===== $log"
              Get-Content $log
            }
          }

      # The openvfs extension is not built here, so this is also the check that
      # requiring occ no longer drags it in.
      - name: Load the extension
        shell: pwsh
        run: ruby -Ilib -Iext -e 'require "openvfs/occ"; puts OpenVFS::VERSION'

      # Saved even when a later step failed: the object files already compiled are
      # exactly what makes the next attempt quick.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: build/desktop-upload
          key: desktop-upload-${{ matrix.target.platform }}-ruby${{ matrix.ruby.abi }}-${{ hashFiles('patches/**') }}-${{ github.sha }}

      - name: Stage the objects
        shell: bash
        run: |
          mkdir -p objects
          cp ext/openvfs/occ/occ.so objects/
          ls -l objects

      - uses: actions/upload-artifact@v4
        with:
          name: objects-${{ matrix.target.platform }}-${{ matrix.ruby.abi }}
          path: objects/*
          if-no-files-found: error

  cross-gem:
    name: Package native gem for ${{ matrix.target.platform }}
    runs-on: ubuntu-latest
    needs: [cross-objects, cross-objects-windows]
    strategy:
      fail-fast: false
      matrix:
        # The platform the objects were built for, and the name RubyGems knows it by:
        # Apple silicon is arm64-darwin there, and a gem named aarch64-darwin would
        # never be selected.
        target:
          - { platform: x86_64-linux, gem_platform: x86_64-linux }
          - { platform: aarch64-linux, gem_platform: aarch64-linux }
          - { platform: x86_64-darwin, gem_platform: x86_64-darwin }
          - { platform: aarch64-darwin, gem_platform: arm64-darwin }
          - { platform: x64-mingw-ucrt, gem_platform: x64-mingw-ucrt }
    steps:
      - uses: actions/checkout@v4

      # Packaging compiles nothing - it copies already-built objects into a gem - so it
      # wants a Ruby and none of the native dependencies, whatever platform the gem is for.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v4
        with:
          pattern: objects-${{ matrix.target.platform }}-*
          path: objects

      # download-artifact names a directory per artifact, so flatten
      # objects/objects-<platform>-<abi>/ down to the objects/<abi>/ layout
      # bin/package-platform-gem reads.
      - name: Arrange the objects by ABI
        run: |
          for directory in objects/objects-${{ matrix.target.platform }}-*; do
            abi="${directory##*-}"
            mkdir -p "objects/$abi"
            mv "$directory"/* "objects/$abi/"
            rmdir "$directory"
          done
          find objects -type f | sort

      - name: Package the platform gem
        run: ruby bin/package-platform-gem ${{ matrix.target.gem_platform }} objects

      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.target.platform }}
          path: pkg/*.gem
          if-no-files-found: error
