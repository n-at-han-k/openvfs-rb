name: Compile

# Builds the native extensions (openvfs/openvfs and openvfs/occ/occ) from source
# across the supported Ruby versions, and uploads the resulting shared objects as
# build artifacts. This is the compilation step that `gem kit release` and the
# cross-platform packaging rely on.
#
# Modeled on the existing test workflow (nix provides Qt 6, the OpenVFS library
# and the trimmed OpenCloud Desktop static library) and the cross-compile
# workflow used by our other native gems.

on:
  push:
    branches: [main]
    paths:
      - 'ext/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'gemset.nix'
      - 'openvfs-rb.gemspec'
      - '.github/workflows/compile.yml'
      - 'lib/**'
  pull_request:
    paths:
      - 'ext/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'gemset.nix'
      - 'openvfs-rb.gemspec'
      - '.github/workflows/compile.yml'
      - 'lib/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile native extensions (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build native extensions
        run: |
          nix develop --command ruby -C ext/openvfs extconf.rb
          nix develop --command make -C ext/openvfs
          nix develop --command ruby -C ext/openvfs/occ extconf.rb
          nix develop --command make -C ext/openvfs/occ

      - name: Run the suite
        run: nix develop --command bundle exec sus

      - name: Upload built extensions
        uses: actions/upload-artifact@v4
        with:
          name: openvfs-rb-extensions-ruby-${{ matrix.ruby }}
          path: |
            ext/openvfs/openvfs.so
            ext/openvfs/occ/occ.so
          if-no-files-found: error
