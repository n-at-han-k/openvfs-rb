name: Cross Compile Windows

# Windows cannot use nix, so it builds the same static library with CMake
# against MSYS2's ucrt64 toolchain - the one RubyInstaller's own ucrt
# builds use - and compiles only the occ extension. The openvfs extension
# is left out here: it wraps libopenvfs, which keeps its placeholder state
# in POSIX extended attributes, and upstream gates its desktop plugin
# behind `if (NOT WIN32)` for that reason. The gem configures
# `virtualFilesMode=off`, so nothing in the API surface needs it.
#
# See cross-compile-linux.yml and cross-compile-macos.yml for the sibling
# platforms; the gem-packaging shape is identical, only the staging differs.

on:
  push:
    branches: [main]
    paths:
      - 'ext/**'
      - 'openvfs-rb.gemspec'
      - 'bin/package-platform-gem'
      - '.github/workflows/cross-compile-windows.yml'
      - 'lib/**'
      - 'patches/**'
      - 'opencloud-desktop'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-objects:
    name: Compile ${{ matrix.target.platform }} objects for Ruby ${{ matrix.ruby.abi }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - { abi: "3.3" }
          - { abi: "3.4" }
          - { abi: "4.0" }
        target:
          - { platform: x64-mingw-ucrt, os: windows-2025 }
    steps:
      # The patches are LF, and git-for-windows would otherwise check the submodule
      # out with CRLF and make every one of them fail to apply.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ruby/setup-ruby-pkgs@v1
        with:
          ruby-version: ${{ matrix.ruby.abi }}
          # cppwinrt is the cfapi plugin's: it registers the sync root through
          # the WinRT storage provider api, which mingw does not carry itself.
          mingw: cmake ninja pkgconf qt6-base qtkeychain sqlite3 zlib extra-cmake-modules cppwinrt

      - name: Apply the desktop patches
        shell: bash
        run: bin/apply-patches

      # The build tree, not the install prefix: ninja then recompiles only the files a
      # patch actually changed instead of all 80 again. CMakeCache.txt holds absolute
      # paths to the toolchain, and MSYS2 lives under the Ruby it came with -
      # .../Ruby/3.4.12/x64/msys64/ucrt64 - so the ABI is part of the key. Sharing one
      # entry across the matrix hands a job a cache naming a Ruby it does not have, and
      # cmake fails on the first tool it tries to run.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: build/desktop-upload
          key: desktop-upload-${{ matrix.target.platform }}-ruby${{ matrix.ruby.abi }}-${{ hashFiles('patches/**') }}-${{ github.sha }}
          restore-keys: |
            desktop-upload-${{ matrix.target.platform }}-ruby${{ matrix.ruby.abi }}-${{ hashFiles('patches/**') }}-
            desktop-upload-${{ matrix.target.platform }}-ruby${{ matrix.ruby.abi }}-

      - name: Build the trimmed desktop static library
        shell: pwsh
        run: |
          $prefix = "$env:GITHUB_WORKSPACE/build/prefix" -replace '\\', '/'
          $sha1 = git -C opencloud-desktop rev-parse HEAD

          # cfapi.h and cldapi are the Windows SDK's, not mingw's, and a mingw
          # build does not look there by itself. Newest SDK wins, and an absent
          # one leaves the paths empty, which the build reports and carries on.
          $kits = "C:/Program Files (x86)/Windows Kits/10"
          $sdk = Get-ChildItem "$kits/Include" -ErrorAction SilentlyContinue |
            Sort-Object Name | Select-Object -Last 1
          if ($sdk) {
            $include = "$kits/Include/$($sdk.Name)/um"
            $lib = "$kits/Lib/$($sdk.Name)/um/x64"
            Write-Host "Windows SDK $($sdk.Name)"
          }

          cmake -S opencloud-desktop -B build/desktop-upload -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_INSTALL_PREFIX=$prefix" `
            "-DCMAKE_INCLUDE_PATH=$include" `
            "-DCMAKE_LIBRARY_PATH=$lib" `
            "-DGIT_SHA1=$sha1"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/desktop-upload
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/desktop-upload
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "OPENCLOUD_UPLOAD_PREFIX=$prefix" >> $env:GITHUB_ENV

      - name: Build the occ extension
        shell: pwsh
        run: |
          gem install rice --no-document
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ruby -C ext/openvfs/occ extconf.rb
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          make -C ext/openvfs/occ
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # extconf reports every failure as "no", so the reason a check failed is only in
      # mkmf.log, which stays on the runner.
      - name: Show mkmf.log
        if: ${{ failure() }}
        shell: pwsh
        run: |
          foreach ($log in @("ext/openvfs/occ/mkmf.log", "ext/openvfs/mkmf.log")) {
            if (Test-Path $log) {
              Write-Host "===== $log"
              Get-Content $log
            }
          }

      # The openvfs extension is not built here, so this is also the check that
      # requiring occ no longer drags it in.
      - name: Load the extension
        shell: pwsh
        run: ruby -Ilib -Iext -e 'require "openvfs/occ"; puts OpenVFS::VERSION'

      # Saved even when a later step failed: the object files already compiled are
      # exactly what makes the next attempt quick.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: build/desktop-upload
          key: desktop-upload-${{ matrix.target.platform }}-ruby${{ matrix.ruby.abi }}-${{ hashFiles('patches/**') }}-${{ github.sha }}

      - name: Stage the objects
        shell: bash
        run: |
          mkdir -p objects
          cp ext/openvfs/occ/occ.so objects/
          ls -l objects

      - uses: actions/upload-artifact@v4
        with:
          name: objects-${{ matrix.target.platform }}-${{ matrix.ruby.abi }}
          path: objects/*
          if-no-files-found: error

  cross-gem:
    name: Package native gem for ${{ matrix.target.platform }}
    runs-on: ubuntu-latest
    needs: cross-objects
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: x64-mingw-ucrt, gem_platform: x64-mingw-ucrt }
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v4
        with:
          pattern: objects-${{ matrix.target.platform }}-*
          path: objects

      - name: Arrange the objects by ABI
        run: |
          for directory in objects/objects-${{ matrix.target.platform }}-*; do
            abi="${directory##*-}"
            mkdir -p "objects/$abi"
            mv "$directory"/* "objects/$abi/"
            rmdir "$directory"
          done
          find objects -type f | sort

      - name: Package the platform gem
        run: ruby bin/package-platform-gem ${{ matrix.target.gem_platform }} objects

      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.target.platform }}
          path: pkg/*.gem
          if-no-files-found: error
